name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite republicar pelo botão "Run workflow" sem precisar de um commit novo
  # — útil quando o que mudou foi um secret, não o código.
  workflow_dispatch:

# Um push novo no mesmo branch cancela a execução anterior: sem fila de builds
# obsoletos consumindo minutos do runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura pnpm
        # A versão vem do campo "packageManager" do package.json.
        uses: pnpm/action-setup@v4

      - name: Configura Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test:coverage

      - name: Publica cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura pnpm
        uses: pnpm/action-setup@v4

      - name: Configura Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Cache do Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vitorialuiza.dev' }}

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Deploy de preview' || 'Deploy de produção' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Só publica depois que lint, tipos, testes e build passaram.
    needs: [quality, build]

    # PR vindo de fork não tem acesso aos secrets; pular evita falha enganosa.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.publish.outputs.url }}

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      PROD_FLAG: ${{ github.event_name != 'pull_request' && '--prod' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # O `vercel build` instala as dependências do projeto, e o runner não vem
      # com pnpm. Sem estes dois passos ele falha antes de compilar qualquer coisa.
      - name: Configura pnpm
        uses: pnpm/action-setup@v4

      - name: Configura Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instala Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixa a configuração do ambiente
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build na Vercel
        run: vercel build $PROD_FLAG --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publica
        id: publish
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy publicado :rocket:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comenta a URL de preview no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deste PR: ${{ steps.publish.outputs.url }}`,
            });
